# 商业化模组库配置。每个模组包含所属模组族、名称、可选变体、标签和适配条件。
# variants 下每项包含 name 和 feats；feat 是该变体下可多选的功能子项。
# 使用两个空格缩进；新增模组时复制一个 modules 下的条目并保持唯一 id。
version: 2
filters:
  condition:
    label: 玩法条件
    options:
      - 失败
      - 通关
      - 关卡
      - 资源
      - 内容
      - 成长
      - 待补充
  goal:
    label: 目标
    options:
      - 广告
      - 付费
      - 留存
      - 消耗
      - 待补充
  cost:
    label: 成本
    options:
      - 开发
      - 内容
      - 运营
      - 待补充
modules:
  - id: module-01
    family: GamePlay
    name: 壁纸奖励
    variants:
      - name: 开局4选1
        feats:
          - 奖励*4 随机抽
          - AD专属位
          - VIP专属位
          - 看广告重抽
      - name: 其他模式
        feats:
          - 奖励*1 随机抽
          - 阶段奖励*3 预配固定
          - 「宝箱奖励」*参考结算奖励
    tags:
      - 激励广告
    conditions:
      - 通关
      - 关卡
  - id: module-02
    family: GamePlay
    name: 结算奖励
    variants:
      - name: 直接奖励
        feats:
          - 金币、道具、资源
          - 看广告双倍
          - 看广告*N倍小游戏
      - name: 宝箱奖励
        feats:
          - 随机出奖励，默认最多可选1项
          - VIP专属（增加可选项）
          - 付费增加可选项
          - 广告增加可选项
          - 局内可升级宝箱
          - 广告领取全部
          - 广告领取双倍
    tags:
      - 激励广告
    conditions:
      - 关卡
