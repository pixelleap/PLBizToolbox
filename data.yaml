# 商业化模组库配置。每个模组包含所属模组族、名称、可选变体、标签和适配条件。
# variants 下每项包含 name 和 feats；feat 是该变体下可多选的功能子项。
# 使用两个空格缩进；新增模组时复制一个 modules 下的条目并保持唯一 id。
version: 2
filters:
  condition:
    label: 玩法条件
    options:
      - 失败
      - 通关
      - 关卡
      - 资源
      - 内容
      - 成长
      - 待补充
  goal:
    label: 目标
    options:
      - 广告
      - 付费
      - 留存
      - 消耗
      - 待补充
  cost:
    label: 成本
    options:
      - 开发
      - 内容
      - 运营
      - 待补充
modules:
  - id: module-01
    family: GamePlay
    name: 壁纸奖励
    variants:
      - name: 开局4选1
        feats:
          - 随机展示4个奖励，选择1个
          - 广告专属奖励位
          - 会员专属奖励位
          - 看广告重抽
      - name: 其他模式
        feats:
          - 随机获得1个奖励
          - 预设3个阶段奖励
          - 使用结算宝箱奖励
    tags:
      - 激励广告
    conditions:
      - 通关
      - 关卡
  - id: module-02
    family: GamePlay
    name: 结算奖励
    variants:
      - name: 直接奖励
        feats:
          - 金币、道具、资源
          - 看广告双倍
          - 看广告参与倍率小游戏
      - name: 宝箱奖励
        feats:
          - 随机出奖励，默认最多可选1项
          - VIP专属（增加可选项）
          - 付费增加可选项
          - 广告增加可选项
          - 局内可升级宝箱
          - 广告领取全部
          - 广告领取双倍
    tags:
      - 激励广告
    conditions:
      - 关卡
  - id: module-03
    family: GamePlay
    name: 失败挽救
    variants:
      - name: 复活
        feats:
          - 广告复活
          - 货币或道具复活
          - 单局复活次数限制
      - name: 加步
        feats:
          - 广告加步
          - 货币购买步数
          - 按失败阶段配置步数
      - name: 加时间
        feats:
          - 广告延长时间
          - 货币购买时间
          - 单局延时次数限制
      - name: 保留进度
        feats:
          - 广告保留本局奖励
          - 付费保留进度
          - 失败后继续入口
      - name: 检查点
        feats:
          - 检查点进度保存
          - 广告从检查点继续
          - 检查点重置规则
    tags:
      - 广告
      - 道具消耗
    conditions:
      - 失败
  - id: module-04
    family: GamePlay
    name: 辅助与道具
    variants:
      - name: 提示
        feats:
          - 免费提示次数
          - 广告获取提示
          - 消耗道具或货币获得提示
      - name: 撤销
        feats:
          - 撤销上一步
          - 广告补充撤销次数
          - 限制连续撤销
      - name: 刷新
        feats:
          - 刷新局面
          - 广告获得刷新
          - 确保刷新后的局面可继续游玩
      - name: 排除错误
        feats:
          - 标记错误项
          - 广告排除错误
          - 按关卡限制使用
      - name: 局内补充
        feats:
          - 局内购买道具
          - 广告补充道具
          - 库存不足时快捷获取
    tags:
      - 广告
      - 资源消耗
    conditions:
      - 失败
      - 资源
  - id: module-05
    family: GamePlay
    name: 临时增益
    variants:
      - name: 开局强化
        feats:
          - 开局选择增益
          - 广告解锁增益
          - 消耗道具启用增益
      - name: 收益加成
        feats:
          - 限时收益倍率
          - 广告激活加成
          - 倍率与持续时间配置
      - name: 限时能力
        feats:
          - 限时技能试用
          - 广告延长持续时间
          - 效果到期提示
      - name: 下局增益
        feats:
          - 结算获得下局增益
          - 广告升级增益
          - 下一局自动生效
    tags:
      - 广告
      - 资源消耗
    conditions:
      - 资源
      - 成长
